
<!doctype html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRYSTAL UNITED</title>
<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f7ef;
  color:#12351f;
}
*{box-sizing:border-box}
.page{padding:24px}
.container{max-width:1180px;margin:auto}
.section{
  margin-top:28px;
  background:white;
  border-radius:32px;
  padding:40px;
  box-shadow:0 24px 80px rgba(18,53,31,.12);
}
.badge{
  display:inline-block;
  background:#f5d66b;
  color:#12351f;
  padding:10px 16px;
  border-radius:999px;
  font-weight:900;
  text-transform:uppercase;
  font-size:14px;
}
.partners{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:16px;
  margin-top:28px;
}
.partner{
  background:#f5f7ef;
  border-radius:24px;
  padding:28px;
  text-decoration:none;
  color:#12351f;
  transition:.2s;
  display:block;
}
.partner:hover{
  transform:translateY(-4px);
}
.partner-logo{
  width:72px;
  height:72px;
  object-fit:contain;
  background:white;
  border-radius:18px;
  padding:10px;
  box-shadow:0 8px 20px rgba(0,0,0,.08);
}
.partner h3{
  margin:18px 0 10px;
  font-size:22px;
}
.partner p{
  margin:0;
  color:#58625b;
  line-height:1.5;
}
@media(max-width:900px){
  .partners{
    grid-template-columns:1fr 1fr;
  }
}
@media(max-width:600px){
  .partners{
    grid-template-columns:1fr;
  }
}
</style>
</head>
<body>

<main class="page">
<div class="container">

<section class="section">
<div class="badge">Партнери</div>
<h1>Наші партнери</h1>

<div class="partners">

<a class="partner" href="https://jaco.com.ua" target="_blank">
<img class="partner-logo" src="https://logo.clearbit.com/jaco.com.ua">
<h3>JACO</h3>
<p>Офіційний партнер клубу</p>
</a>

<a class="partner" href="https://ksm-group.ua" target="_blank">
<img class="partner-logo" src="https://logo.clearbit.com/ksm-group.ua">
<h3>KSM GROUP</h3>
<p>Будівельний та девелоперський партнер</p>
</a>

<a class="partner" href="https://dus-level.com/about-us" target="_blank">
<img class="partner-logo" src="https://logo.clearbit.com/dus-level.com">
<h3>DUS LEVEL</h3>
<p>Партнер та підтримка розвитку клубу</p>
</a>

<div class="partner">
<img class="partner-logo" src="https://dummyimage.com/200x200/12351f/ffffff&text=MTS">
<h3>МЕГАТЕХСЕРВІС</h3>
<p>Партнер дитячого футбольного клубу</p>
</div>

</div>
</section>

</div>
</main>

</body>
</html>
